<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Casas en Disputa</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 32px;
        background: #111827;
        color: #f3f4f6;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      textarea {
        width: 100%;
        min-height: 220px;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #374151;
        background: #0f172a;
        color: #f8fafc;
      }
      button {
        margin-top: 12px;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        background: #22c55e;
        color: #052e16;
        font-weight: bold;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Casas en Disputa</h1>
      <p>Envía el estado del tablero en JSON para que el bot decida el movimiento.</p>

      <textarea id="jsonInput" spellcheck="false">{
  "jugador": "A",
  "dado": 3,
  "tablero": [
    ["", "", "", "", "", "", "", "", "", ""],
    ["", "", "", "", "", "", "", "", "", ""],
    ["", "", "", "", "", "", "", "", "", ""],
    ["", "", "", "", "", "", "", "", "", ""],
    ["", "", "", "", "", "", "", "", "", ""],
    ["", "", "", "", "", "", "", "", "", ""],
    ["", "", "", "", "", "", "", "", "", ""],
    ["", "", "", "", "", "", "", "", "", ""],
    ["", "", "", "", "", "", "", "", "", ""],
    ["", "", "", "", "", "", "", "", "", ""]
  ]
}</textarea>

      <button id="sendButton">Enviar movimiento</button>
      <h2>Resultado</h2>
      <pre id="resultado">Esperando...</pre>
    </div>

    <script>
      const jsonInput = document.getElementById('jsonInput');
      const resultado = document.getElementById('resultado');
      const sendButton = document.getElementById('sendButton');

      sendButton.addEventListener('click', async () => {
        try {
          const payload = JSON.parse(jsonInput.value);
          const response = await fetch('/move', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const text = await response.text();
          resultado.textContent = text;
        } catch (error) {
          resultado.textContent = 'Error: ' + error.message;
        }
      });
    </script>
  </body>
</html>
